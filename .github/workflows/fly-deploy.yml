name: Deploy to Fly.io

on:
  push:
    branches:
      - main

jobs:
  deploy-ws-proxy:
    name: Deploy ws-proxy
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'ws-proxy/') ||
      contains(github.event.head_commit.added, 'ws-proxy/')
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        working-directory: ws-proxy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-nado-matches:
    name: Deploy nado-matches
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'services/nado-matches/') ||
      contains(github.event.head_commit.added, 'services/nado-matches/')
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        working-directory: services/nado-matches
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-nado-funding:
    name: Deploy nado-funding
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'services/nado-funding/') ||
      contains(github.event.head_commit.added, 'services/nado-funding/')
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        working-directory: services/nado-funding
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
