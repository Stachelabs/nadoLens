# DO NOT run `fly scale count 2` (or higher) on this app without first
# migrating the rate-limiter's weightLog to Redis — it's in-memory,
# per-process state (see services/nado-funding/index.ts). Scaling past 1
# machine would silently double the effective rate budget past Nado's real
# ceiling.
# min_machines_running below is a FLOOR (never scale to zero), not a
# ceiling — Fly does not auto-scale this app's machine count under load;
# `fly scale count` is the only lever that changes it.
app = "nadolens-nado-funding"
primary_region = "fra"

[build]
  [build.args]
    BUN_VERSION = "latest"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
